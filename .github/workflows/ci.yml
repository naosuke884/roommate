name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # hook は --no-verify で飛ばせるので、push された commit もここで検査する
      - name: commitlint (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: commitlint (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }}

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm turbo run build typecheck test
      # ゲームはタグの roommate-sdk.js をそのまま取り込むので、commit したものがビルドと同じか確かめる
      - name: roommate-sdk.js が最新か
        run: git diff --exit-code packages/roommate-sdk/dist

  roommate-sdk-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/roommate-sdk
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release

  # crate の version のタグが無ければ、その commit に打つ。ゲームはこのタグの crate と roommate-sdk.js を使う。
  # 前の push との差分ではなくタグの有無で決めるので、再実行や前の失敗のあとでも打ち漏らさない
  tag-roommate-sdk:
    needs: [check, roommate-sdk-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-roommate-sdk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # GITHUB_TOKEN で push したタグでは workflow が起きない。タグで動かす job を足すなら PAT か GitHub App が要る
      - name: version のタグが無ければ打つ
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/roommate-sdk/Cargo.toml | head -n 1)
          tag="roommate-sdk-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag はもうある"
            exit 0
          fi
          latest=$(git ls-remote --tags --refs origin 'roommate-sdk-v*' | sed 's#.*refs/tags/roommate-sdk-v##' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::version $version が、出した最新の $latest より古い"
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

  deploy:
    needs: [check, roommate-sdk-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 1 つの app が落ちても、ほかの app のデプロイは続ける
      - run: pnpm turbo run deploy --continue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_SECRET_PREVIOUS: ${{ secrets.JWT_SECRET_PREVIOUS }}
      # デプロイできても本番が応答していないことがある。反映の遅れはスクリプト側で試し直す
      - name: 本番が応答するか
        run: pnpm --filter @roommate/catalog check-production
